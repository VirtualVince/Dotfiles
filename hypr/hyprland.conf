exec-once = sleep 1
# ---- Environment ----
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ---- Monitors ----
# Matched by description, not connector name: connector names depend on GPU
# driver load order (HDMI-A-3/DP-3 before nvidia was in the initramfs,
# HDMI-A-1/DP-1 after). waybar + hyprpaper only take names, so they use
# HDMI-A-1/DP-1.
$acer = desc:Acer Technologies Acer K272HL T0BAA0024204
$dell = desc:Dell Inc. DELL 2007FP C953681N2JPS

# Acer (main)
monitor=$acer,1920x1080@60,0x0,1

# Dell 2007FP (portrait, left)
monitor=$dell,1600x1200@60,-1200x-260,1,transform,1

# ---- Workspace + Monitor mapping ----
workspace=1,monitor:$acer,default:true
workspace=2,monitor:$acer
workspace=3,monitor:$acer
workspace=4,monitor:$acer
workspace=5,monitor:$acer

workspace=6,monitor:$dell
workspace=7,monitor:$dell
workspace=8,monitor:$dell
workspace=9,monitor:$dell
workspace=10,monitor:$dell

# ---- Workspace switching ----
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# ---- Move window to workspace ----
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# ---- Keybinds ----
$mainMod = SUPER
bind = $mainMod, RETURN, exec, kitty
bind = SUPER, Q, killactive
bind = SUPER, D, exec, rofi -show drun
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, b, exec, brave
bind = SUPER, n, exec,  nvim
bind = SUPER, o, exec, obsidian
bind = SUPER, r, exec, obs
bind = SUPER, s, exec, steam
bind = SUPER, m, exec, pavucontrol
bind = SUPER SHIFT, f, exec, thunar
bind = SUPER SHIFT, s, exec, ~/.screenshot.sh
bind = SUPER SHIFT, k, exec, systemctl suspend

# ---- Media keys headset power button ----
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# --- Mouse ---
input {
    follow_mouse = 1
    mouse_refocus = false
}

# ---- Autostart ----
exec-once = waybar &
exec-once = dunst &
exec-once = nm-applet &
exec-once = hyprpaper -c ~/.config/hypr/hyprpaper.conf

# Mark the Acer as the XWayland primary output. Wine/Proton picks the RandR
# primary as the Windows primary display; without this, XWayland normalises
# Dell (top-left in layout terms) to 0,0 and games fullscreen onto the
# portrait Dell. Delayed so XWayland is up before xrandr runs. The script
# looks up the Acer's current connector name instead of hardcoding it.
exec-once = sh -c 'sleep 3; sh ~/.config/hypr/scripts/xwayland-primary.sh'

# Spam-click macro. The daemon installs its own mouse:276 bind and removes it
# whenever a game is running. Config: ~/.config/autoclicker.conf
exec-once = python3 /home/vince/.local/bin/autoclickerd

# ============================================================
# DeadSec Theme — Look and Feel
# ============================================================

general {
    border_size         = 1
    gaps_in             = 4
    gaps_out            = 8
    col.active_border   = rgba(c99a6e99)
    col.inactive_border = rgba(2a252299)
    resize_on_border    = true
    allow_tearing       = false
    layout              = dwindle
}

decoration {
    rounding         = 4

    active_opacity   = 1.0
    inactive_opacity = 0.93

    shadow {
        enabled        = true
        range          = 10
        render_power   = 3
        color          = rgba(0000001a)
        color_inactive = rgba(00000000)
    }

    blur {
        enabled           = true
        size              = 4
        passes            = 2
        new_optimizations = true
        xray              = false
    }
}

animations {
    enabled = true

    bezier = dedsec, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0,    0,   1,   1
    bezier = snap,   0.15, 0,   0.1, 1

    animation = windows,    1, 4, dedsec, slide
    animation = windowsOut, 1, 3, default, slide
    animation = border,     1, 8, dedsec
    animation = fade,       1, 3, linear
    animation = workspaces, 1, 4, snap, slide
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
}

