# autoclicker config - restart the daemon after editing:
#   pkill -f autoclickerd; ~/.local/bin/autoclickerd &

# hold   = clicks while you hold the side button (release stops it)
# toggle = one press starts, next press stops
MODE=hold

# clicks per second
CPS=20

# which mouse button triggers it (Linux evdev button codes)
#   275 = BTN_SIDE  (rear side button / browser "back")
#   276 = BTN_EXTRA (front side button / browser "forward")
BUTTON=276

# how long each click is held down, milliseconds. Must stay below 1000/CPS.
# Too short and some apps (Electron, Java, some games' menus) drop the click.
HOLD_MS=20

# safety cap: a single continuous burst never runs longer than this
MAX_SECONDS=60

# Extra things that count as "a game is running", comma-separated regexes.
# Built-in process markers: SteamLaunch AppId=, gamescope, proton
# waitforexitandrun, wineserver, anything *.exe
# Built-in window classes: steam_app_<n>, gamescope, *.exe
GAME_PROCS=
GAME_CLASSES=
